<!doctype html>
<html>
<head><meta charset="utf-8"><style>
body{width:220px;margin:0;padding:14px;background:#141414;color:#eee;font:14px "Segoe UI",Arial}
#btn,#diag{width:100%;padding:10px;font-size:15px;font-weight:700;border:0;border-radius:8px;cursor:pointer;margin-top:8px}
.on{background:#22c55e;color:#06130a}
.off{background:#333;color:#eee}
#st{margin-top:8px;font-size:12px;color:#aaa;text-align:center}
#test{margin-top:10px;padding:8px;border:1px dashed #555;border-radius:8px;font-size:13px}
#test::selection{background:transparent!important;color:inherit!important}
</style></head>
<body>
<button id="btn" class="off">ACTIVAR</button>
<div id="st">resaltado visible</div>
<button id="diag" class="off">Diagnosticar pestana</button>
<div id="test">Selecciona este texto: si NO se ve azul, el CSS funciona en tu Chrome.</div>
<script src="popup.js"></script>
</body>
</html>
